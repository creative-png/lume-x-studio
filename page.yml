# ==============================================================================
# LUMÉ STUDIO - CMS Configuration connected to siteConfig.json
# File: page.yml
# Target Data File: src/data/siteConfig.json
# Format: JSON
# Description: This configuration file connects your CMS (Decap CMS, Netlify CMS,
#              Pages CMS, Sveltia CMS) to src/data/siteConfig.json for editing.
# ==============================================================================

backend:
  name: git-gateway
  branch: main

media_folder: "src/assets/images"
public_folder: "/src/assets/images"

# Target Data File Connection
name: "home_page"
label: "Home Page Content"
file: "src/data/siteConfig.json"
path: "src/data/siteConfig.json"
format: "json"
extension: "json"

collections:
  - name: "pages"
    label: "Pages"
    files:
      - file: "src/data/siteConfig.json"
        name: "home"
        label: "Home Page"
        format: "json"
        extension: "json"
        fields:
          # --- Studio Details ---
          - label: "Studio Info"
            name: "owner"
            widget: "object"
            fields:
              - { label: "Studio Name", name: "name", widget: "string" }
              - { label: "Tagline", name: "tagline", widget: "string" }
              - { label: "Lead Photographer / Creative Direction", name: "leadPhotographer", widget: "string" }
              - { label: "Contact Email", name: "email", widget: "string" }
              - { label: "Phone Number", name: "phone", widget: "string" }
              - { label: "WhatsApp Number (Digits only)", name: "whatsappNumber", widget: "string" }
              - { label: "Studio Locations", name: "locations", widget: "string" }
              - { label: "Instagram URL", name: "instagram", widget: "string" }
              - { label: "Pinterest URL", name: "pinterest", widget: "string" }
              - { label: "Vimeo URL", name: "vimeo", widget: "string" }
              - { label: "Demo Disclaimer Note", name: "demoNote", widget: "string" }

          # --- Hero Section ---
          - label: "Hero Section"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Top Kicker", name: "kicker", widget: "string" }
              - { label: "Main Headline", name: "title", widget: "string" }
              - { label: "Underline Highlight Phrase", name: "underlineText", widget: "string" }
              - { label: "Lead Intro Paragraph", name: "lead", widget: "text" }
              - { label: "Hero Background Image", name: "backgroundImage", widget: "image" }
              - { label: "View Work CTA Label", name: "ctaWork", widget: "string" }
              - { label: "Check Date CTA Label", name: "ctaDate", widget: "string" }
              - { label: "Vertical Side Text", name: "verticalMeta", widget: "string" }

          # --- Portfolio Stories ---
          - label: "The Work / Portfolio Stories"
            name: "work"
            widget: "object"
            fields:
              - { label: "Section Kicker", name: "kicker", widget: "string" }
              - { label: "Section Title", name: "title", widget: "string" }
              - { label: "Section Lead Copy", name: "lead", widget: "text" }
              - label: "Wedding Stories List"
                name: "stories"
                widget: "list"
                fields:
                  - { label: "Story Slug / ID", name: "id", widget: "string" }
                  - { label: "Story Number (e.g. 01)", name: "number", widget: "string" }
                  - { label: "Couple Names", name: "couple", widget: "string" }
                  - { label: "Venue & Location", name: "location", widget: "string" }
                  - { label: "Card Description", name: "description", widget: "text" }
                  - { label: "Card Cover Image", name: "coverImage", widget: "image" }
                  - { label: "Coverage Duration", name: "coverage", widget: "string" }
                  - { label: "Collection Package", name: "collection", widget: "string" }
                  - { label: "Story Tagline", name: "tagline", widget: "string" }
                  - { label: "Detailed Narrative", name: "narrative", widget: "text" }
                  - label: "Couple Quote"
                    name: "quote"
                    widget: "object"
                    fields:
                      - { label: "Quote Text", name: "text", widget: "text" }
                      - { label: "Author Attribution", name: "author", widget: "string" }
                  - label: "Gallery Photographs"
                    name: "galleryImages"
                    widget: "list"
                    fields:
                      - { label: "Photo URL", name: "url", widget: "image" }
                      - { label: "Caption", name: "caption", widget: "string" }

          # --- Google Reviews ---
          - label: "Google Reviews & Testimonials"
            name: "reviews"
            widget: "object"
            fields:
              - { label: "Section Kicker", name: "kicker", widget: "string" }
              - { label: "Score Rating", name: "rating", widget: "string" }
              - { label: "Star Graphic", name: "stars", widget: "string" }
              - { label: "Total Reviews Count", name: "totalCount", widget: "number", value_type: "int" }
              - { label: "Subtitle", name: "subtitle", widget: "string" }
              - label: "Reviews List"
                name: "list"
                widget: "list"
                fields:
                  - { label: "Review ID", name: "id", widget: "string" }
                  - { label: "Client Name", name: "name", widget: "string" }
                  - { label: "Date / Time Ago", name: "timeAgo", widget: "string" }
                  - { label: "Review Text", name: "text", widget: "text" }

          # --- Why Lumé Philosophy ---
          - label: "Why Lumé Philosophy"
            name: "why"
            widget: "object"
            fields:
              - { label: "Kicker", name: "kicker", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - label: "Observed Moments List"
                name: "moments"
                widget: "list"
                field: { label: "Moment Description", name: "moment", widget: "string" }
              - { label: "Conclusion Line", name: "conclusion", widget: "string" }
              - label: "Process Steps"
                name: "steps"
                widget: "list"
                fields:
                  - { label: "Step Title (Before/During/After)", name: "title", widget: "string" }
                  - { label: "Step Description", name: "description", widget: "text" }

          # --- Collections & Pricing ---
          - label: "Collections & Investment"
            name: "collections"
            widget: "object"
            fields:
              - { label: "Kicker", name: "kicker", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Travel Note", name: "note", widget: "string" }
              - label: "Packages"
                name: "packages"
                widget: "list"
                fields:
                  - { label: "Package Name", name: "name", widget: "string" }
                  - { label: "Price Text", name: "price", widget: "string" }
                  - { label: "Featured Package?", name: "featured", widget: "boolean" }
                  - { label: "Cover Photo", name: "coverImage", widget: "image" }
                  - label: "Included Features List"
                    name: "items"
                    widget: "list"
                    field: { label: "Deliverable Feature", name: "item", widget: "string" }

          # --- Frequently Asked Questions ---
          - label: "FAQ Section"
            name: "faq"
            widget: "object"
            fields:
              - { label: "Kicker", name: "kicker", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - label: "Questions List"
                name: "questions"
                widget: "list"
                fields:
                  - { label: "Question", name: "q", widget: "string" }
                  - { label: "Answer", name: "a", widget: "text" }

          # --- Contact & Inquiry ---
          - label: "Contact / Date Checker Section"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Kicker", name: "kicker", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Lead Instruction", name: "lead", widget: "text" }

