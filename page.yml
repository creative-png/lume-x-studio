media:
  input: src/assets/images
  output: /src/assets/images

content:
  - name: site
    label: Website content
    type: file
    path: src/data/siteconfig.json
    format: json
    fields:
      - name: owner
        label: Business details
        type: object
        fields:
          - { name: name, label: Business name, type: string }
          - { name: tagline, label: Tagline, type: string }
          - { name: leadPhotographer, label: Credit line, type: string }
          - { name: email, label: Email, type: string }
          - { name: phone, label: Phone number, type: string }
          - { name: whatsappNumber, label: WhatsApp number (91XXXXXXXXXX, no + or spaces), type: string }
          - { name: locations, label: Locations, type: string }
          - { name: instagram, label: Instagram link, type: string }
          - { name: pinterest, label: Pinterest link, type: string }
          - { name: vimeo, label: Vimeo link, type: string }
          - { name: demoNote, label: Demo note (footer), type: text }

      - name: hero
        label: Hero (top section)
        type: object
        fields:
          - { name: kicker, label: Small top line, type: string }
          - { name: title, label: Main heading, type: string }
          - { name: underlineText, label: Underlined part of heading (must match words in heading), type: string }
          - { name: lead, label: Intro paragraph, type: text }
          - { name: backgroundImage, label: Background image, type: image }
          - { name: ctaWork, label: Button 1 text, type: string }
          - { name: ctaDate, label: Button 2 text, type: string }
          - { name: verticalMeta, label: Vertical side text, type: string }

      - name: work
        label: Work section
        type: object
        fields:
          - { name: kicker, label: Small top line, type: string }
          - { name: title, label: Heading, type: string }
          - { name: lead, label: Intro paragraph, type: text }
          - name: stories
            label: Wedding stories (cards)
            type: object
            list: true
            fields:
              - { name: id, label: ID (lowercase, no spaces, e.g. amara-veer), type: string }
              - { name: number, label: Number (01, 02...), type: string }
              - { name: couple, label: Couple names, type: string }
              - { name: location, label: Location, type: string }
              - { name: description, label: Short description, type: text }
              - { name: coverImage, label: Cover image, type: image }
              - { name: coverage, label: Coverage, type: string }
              - { name: collection, label: Collection name, type: string }
              - { name: tagline, label: Tagline, type: text }
              - { name: narrative, label: Story text, type: text }
              - name: quote
                label: Client quote
                type: object
                fields:
                  - { name: text, label: Quote, type: text }
                  - { name: author, label: Author, type: string }
              - name: galleryImages
                label: Gallery photos
                type: object
                list: true
                fields:
                  - { name: url, label: Photo, type: image }
                  - { name: caption, label: Caption, type: text }

      - name: reviews
        label: Reviews section
        type: object
        fields:
          - { name: kicker, label: Small top line, type: string }
          - { name: rating, label: Rating (e.g. 5.0), type: string }
          - { name: stars, label: Stars text, type: string }
          - { name: totalCount, label: Total review count, type: number }
          - { name: subtitle, label: Subtitle, type: string }
          - name: list
            label: Reviews
            type: object
            list: true
            fields:
              - { name: id, label: ID (r1, r2...), type: string }
              - { name: name, label: Reviewer name, type: string }
              - { name: timeAgo, label: Time ago, type: string }
              - { name: text, label: Review text, type: text }

      - name: why
        label: Why us section
        type: object
        fields:
          - { name: kicker, label: Small top line, type: string }
          - { name: title, label: Heading, type: string }
          - { name: moments, label: Moments list, type: string, list: true }
          - { name: conclusion, label: Conclusion line, type: string }
          - name: steps
            label: Steps (Before / During / After)
            type: object
            list: true
            fields:
              - { name: title, label: Step title, type: string }
              - { name: description, label: Description, type: text }

      - name: collections
        label: Packages section
        type: object
        fields:
          - { name: kicker, label: Small top line, type: string }
          - { name: title, label: Heading, type: string }
          - { name: note, label: Note under packages, type: string }
          - name: packages
            label: Packages
            type: object
            list: true
            fields:
              - { name: name, label: Package name, type: string }
              - { name: price, label: Price, type: string }
              - { name: featured, label: Highlight this package, type: boolean }
              - { name: coverImage, label: Cover image, type: image }
              - { name: items, label: What's included, type: string, list: true }

      - name: faq
        label: FAQ section
        type: object
        fields:
          - { name: kicker, label: Small top line, type: string }
          - { name: title, label: Heading, type: string }
          - name: questions
            label: Questions
            type: object
            list: true
            fields:
              - { name: q, label: Question, type: string }
              - { name: a, label: Answer, type: text }

      - name: contact
        label: Contact section
        type: object
        fields:
          - { name: kicker, label: Small top line, type: string }
          - { name: title, label: Heading, type: string }
          - { name: lead, label: Intro paragraph, type: text }
