backend:
  name: git-gateway
  branch: main

media_folder: "src/assets/images"
public_folder: "/src/assets/images"

collections:
  - name: "pages"
    label: "Pages"
    files:
      - file: "src/data/siteConfig.json"
        name: "home"
        label: "Home Page"
        format: "json"
        extension: "json"
        fields:
          - label: "Studio Info"
            name: "owner"
            widget: "object"
            fields:
              - { label: "Studio Name", name: "name", widget: "string" }
              - { label: "Tagline", name: "tagline", widget: "string" }
              - { label: "Lead Photographer", name: "leadPhotographer", widget: "string" }
              - { label: "Email", name: "email", widget: "string" }
              - { label: "Phone", name: "phone", widget: "string" }
              - { label: "WhatsApp Number", name: "whatsappNumber", widget: "string" }
              - { label: "Locations", name: "locations", widget: "string" }
              - { label: "Instagram", name: "instagram", widget: "string" }
              - { label: "Pinterest", name: "pinterest", widget: "string" }
              - { label: "Vimeo", name: "vimeo", widget: "string" }
          - label: "Hero Section"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Kicker", name: "kicker", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Underline Text", name: "underlineText", widget: "string" }
              - { label: "Lead Text", name: "lead", widget: "text" }
              - { label: "Background Image", name: "backgroundImage", widget: "image" }
              - { label: "CTA Work Button", name: "ctaWork", widget: "string" }
              - { label: "CTA Date Button", name: "ctaDate", widget: "string" }
          - label: "The Work"
            name: "work"
            widget: "object"
            fields:
              - { label: "Kicker", name: "kicker", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Lead Text", name: "lead", widget: "text" }
              - label: "Stories"
                name: "stories"
                widget: "list"
                fields:
                  - { label: "ID", name: "id", widget: "string" }
                  - { label: "Number", name: "number", widget: "string" }
                  - { label: "Couple", name: "couple", widget: "string" }
                  - { label: "Location", name: "location", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }
                  - { label: "Cover Image", name: "coverImage", widget: "image" }
                  - { label: "Coverage", name: "coverage", widget: "string" }
                  - { label: "Collection Package", name: "collection", widget: "string" }
                  - { label: "Tagline", name: "tagline", widget: "string" }
                  - { label: "Narrative", name: "narrative", widget: "text" }
          - label: "Google Reviews"
            name: "reviews"
            widget: "object"
            fields:
              - { label: "Rating", name: "rating", widget: "string" }
              - { label: "Total Reviews Count", name: "totalCount", widget: "number", value_type: "int" }
              - label: "Review List"
                name: "list"
                widget: "list"
                fields:
                  - { label: "Client Name", name: "name", widget: "string" }
                  - { label: "Time Ago", name: "timeAgo", widget: "string" }
                  - { label: "Review Text", name: "text", widget: "text" }
          - label: "Collections"
            name: "collections"
            widget: "object"
            fields:
              - label: "Packages"
                name: "packages"
                widget: "list"
                fields:
                  - { label: "Package Name", name: "name", widget: "string" }
                  - { label: "Price", name: "price", widget: "string" }
                  - { label: "Featured", name: "featured", widget: "boolean" }
                  - { label: "Cover Image", name: "coverImage", widget: "image" }
                  - label: "Items"
                    name: "items"
                    widget: "list"
                    field: { label: "Item", name: "item", widget: "string" }
          - label: "FAQ"
            name: "faq"
            widget: "object"
            fields:
              - label: "Questions"
                name: "questions"
                widget: "list"
                fields:
                  - { label: "Question", name: "q", widget: "string" }
                  - { label: "Answer", name: "a", widget: "text" }
          - label: "Contact Section"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Kicker", name: "kicker", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Lead Text", name: "lead", widget: "text" }
