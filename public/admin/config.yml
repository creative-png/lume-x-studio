backend:
  name: git-gateway
  branch: main

media_folder: "src/assets/images"
public_folder: "/src/assets/images"

collections:
  - name: "pages"
    label: "Pages"
    files:
      - file: "src/data/siteConfig.json"
        name: "home"
        label: "Home Page"
        format: "json"
        fields:
          - label: "Studio & Business Info"
            name: "owner"
            widget: "object"
            fields:
              - { label: "Studio Name", name: "name", widget: "string" }
              - { label: "Tagline", name: "tagline", widget: "string" }
              - { label: "Lead Photographer", name: "leadPhotographer", widget: "string" }
              - { label: "Email", name: "email", widget: "string" }
              - { label: "Phone", name: "phone", widget: "string" }
              - { label: "WhatsApp Number", name: "whatsappNumber", widget: "string" }
              - { label: "Locations", name: "locations", widget: "string" }
              - { label: "Instagram", name: "instagram", widget: "string" }
              - { label: "Pinterest", name: "pinterest", widget: "string" }
              - { label: "Vimeo", name: "vimeo", widget: "string" }
              - { label: "Demo Disclaimer Note", name: "demoNote", widget: "text" }

          - label: "Hero Banner"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Hero Kicker", name: "kicker", widget: "string" }
              - { label: "Main Headline", name: "title", widget: "string" }
              - { label: "Underline Highlight Phrase", name: "underlineText", widget: "string" }
              - { label: "Introduction Paragraph", name: "lead", widget: "text" }
              - { label: "Hero Background Image", name: "backgroundImage", widget: "image" }
              - { label: "View Work Button Label", name: "ctaWork", widget: "string" }
              - { label: "Check Date Button Label", name: "ctaDate", widget: "string" }
              - { label: "Vertical Side Text", name: "verticalMeta", widget: "string" }

          - label: "Portfolio Stories"
            name: "work"
            widget: "object"
            fields:
              - { label: "Section Kicker", name: "kicker", widget: "string" }
              - { label: "Section Headline", name: "title", widget: "string" }
              - { label: "Section Introduction", name: "lead", widget: "text" }
              - label: "Wedding Stories"
                name: "stories"
                widget: "list"
                fields:
                  - { label: "Story ID", name: "id", widget: "string" }
                  - { label: "Story Number", name: "number", widget: "string" }
                  - { label: "Couple Names", name: "couple", widget: "string" }
                  - { label: "Venue & Location", name: "location", widget: "string" }
                  - { label: "Card Description", name: "description", widget: "text" }
                  - { label: "Cover Image", name: "coverImage", widget: "image" }
                  - { label: "Coverage Duration", name: "coverage", widget: "string" }
                  - { label: "Associated Package", name: "collection", widget: "string" }
                  - { label: "Inner Page Tagline", name: "tagline", widget: "string" }
                  - { label: "Editorial Narrative", name: "narrative", widget: "text" }
                  - label: "Couple Quote"
                    name: "quote"
                    widget: "object"
                    fields:
                      - { label: "Quote Text", name: "text", widget: "text" }
                      - { label: "Quote Author", name: "author", widget: "string" }
                  - label: "Gallery Photographs"
                    name: "galleryImages"
                    widget: "list"
                    fields:
                      - { label: "Photograph Image", name: "url", widget: "image" }
                      - { label: "Photograph Caption", name: "caption", widget: "string" }

          - label: "Google Reviews"
            name: "reviews"
            widget: "object"
            fields:
              - { label: "Section Kicker", name: "kicker", widget: "string" }
              - { label: "Star Rating Score", name: "rating", widget: "string" }
              - { label: "Star Symbols", name: "stars", widget: "string" }
              - { label: "Total Review Count", name: "totalCount", widget: "number", value_type: "int" }
              - { label: "Rating Subtitle", name: "subtitle", widget: "string" }
              - label: "Client Reviews"
                name: "list"
                widget: "list"
                fields:
                  - { label: "Review ID", name: "id", widget: "string" }
                  - { label: "Client Name", name: "name", widget: "string" }
                  - { label: "Time Ago", name: "timeAgo", widget: "string" }
                  - { label: "Review Content", name: "text", widget: "text" }

          - label: "Why Lumé Philosophy"
            name: "why"
            widget: "object"
            fields:
              - { label: "Section Kicker", name: "kicker", widget: "string" }
              - { label: "Section Headline", name: "title", widget: "string" }
              - label: "Observed Moments List"
                name: "moments"
                widget: "list"
                field: { label: "Moment", name: "moment", widget: "string" }
              - { label: "Conclusion Statement", name: "conclusion", widget: "string" }
              - label: "Process Steps"
                name: "steps"
                widget: "list"
                fields:
                  - { label: "Step Title", name: "title", widget: "string" }
                  - { label: "Step Description", name: "description", widget: "text" }

          - label: "Collections & Pricing"
            name: "collections"
            widget: "object"
            fields:
              - { label: "Section Kicker", name: "kicker", widget: "string" }
              - { label: "Section Headline", name: "title", widget: "string" }
              - { label: "Travel Note", name: "note", widget: "string" }
              - label: "Curated Packages"
                name: "packages"
                widget: "list"
                fields:
                  - { label: "Package Name", name: "name", widget: "string" }
                  - { label: "Starting Investment", name: "price", widget: "string" }
                  - { label: "Featured Highlight Package", name: "featured", widget: "boolean" }
                  - { label: "Package Thumbnail Image", name: "coverImage", widget: "image" }
                  - label: "Included Features"
                    name: "items"
                    widget: "list"
                    field: { label: "Feature", name: "item", widget: "string" }

          - label: "Frequently Asked Questions"
            name: "faq"
            widget: "object"
            fields:
              - { label: "Section Kicker", name: "kicker", widget: "string" }
              - { label: "Section Headline", name: "title", widget: "string" }
              - label: "Frequently Asked Questions"
                name: "questions"
                widget: "list"
                fields:
                  - { label: "Question", name: "q", widget: "string" }
                  - { label: "Answer", name: "a", widget: "text" }

          - label: "Contact & Date Checker"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Section Kicker", name: "kicker", widget: "string" }
              - { label: "Section Headline", name: "title", widget: "string" }
              - { label: "Instructions / Lead Copy", name: "lead", widget: "text" }
