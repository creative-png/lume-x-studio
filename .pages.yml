# --- Frequently Asked Questions (FAQ) ---
faq:
  kicker: "Good to know"
  title: "Questions couples ask us."
  questions:
    - q: "How far ahead should we book?"
      a: "Most couples reach out 8 to 12 months ahead. We accept a limited number of celebrations each year, so peak wedding dates go first."
    - q: "Do you travel for weddings?"
      a: "Yes. We shoot across India and worldwide. Destination quotes include travel and stay and are shared on request."
    - q: "When do we receive our photographs?"
      a: "Every photograph is selected and colour-finished by hand. Share your date and we'll confirm delivery timelines for your collection."
    - q: "How do we confirm a date?"
      a: "Send us your date, venue and a little about your plans. We reply personally, then lock the date with a booking agreement."

