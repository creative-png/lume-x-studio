# --- Why Lumé Studio Philosophy ---
why:
  kicker: "Why Lumé"
  title: "Not just the big moments."
  moments:
    - "The nervous hands before the ceremony."
    - "Your mother's expression when she sees you dressed."
    - "A friend laughing in the corner."
    - "The empty dance floor at 2 AM."
    - "The last hug before everyone leaves."
  conclusion: "Those are the photographs we look for."
  steps:
    - title: "Before"
      description: "We get to know your story, your people and the atmosphere you're imagining."
    - title: "During"
      description: "We photograph naturally, stepping in only when direction genuinely adds something."
    - title: "After"
      description: "Every photograph is carefully selected, colour-finished and curated into a visual story."

