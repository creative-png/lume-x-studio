# Pages CMS configuration (https://pagescms.org)
media:
  input: src/assets/images
  output: /src/assets/images

content:
  - name: page
    label: Home Page Content
    type: file
    path: src/data/siteConfig.json
    fields:
      - name: owner
        label: Studio Details
        type: object
        fields:
          - { name: name, label: Studio Name, type: string }
          - { name: tagline, label: Tagline, type: string }
          - { name: leadPhotographer, label: Lead Photographer, type: string }
          - { name: email, label: Email, type: string }
          - { name: phone, label: Phone, type: string }
          - { name: whatsappNumber, label: WhatsApp Number, type: string }
          - { name: locations, label: Locations, type: string }
          - { name: instagram, label: Instagram, type: string }
          - { name: pinterest, label: Pinterest, type: string }
          - { name: vimeo, label: Vimeo, type: string }
      - name: hero
        label: Hero Section
        type: object
        fields:
          - { name: kicker, label: Kicker, type: string }
          - { name: title, label: Headline, type: string }
          - { name: underlineText, label: Underlined Phrase, type: string }
          - { name: lead, label: Lead Text, type: string }
          - { name: backgroundImage, label: Background Image, type: image }
          - { name: ctaWork, label: Work CTA, type: string }
          - { name: ctaDate, label: Date CTA, type: string }
      - name: work
        label: Portfolio Stories
        type: object
        fields:
          - { name: kicker, label: Kicker, type: string }
          - { name: title, label: Title, type: string }
          - { name: lead, label: Lead Text, type: string }
          - name: stories
            label: Stories
            type: list
            fields:
              - { name: id, label: ID, type: string }
              - { name: number, label: Number, type: string }
              - { name: couple, label: Couple, type: string }
              - { name: location, label: Location, type: string }
              - { name: description, label: Description, type: string }
              - { name: coverImage, label: Cover Image, type: image }
              - { name: coverage, label: Coverage, type: string }
              - { name: collection, label: Collection, type: string }
              - { name: tagline, label: Tagline, type: string }
              - { name: narrative, label: Narrative, type: string }
      - name: reviews
        label: Google Reviews
        type: object
        fields:
          - { name: kicker, label: Kicker, type: string }
          - { name: rating, label: Rating, type: string }
          - { name: totalCount, label: Review Count, type: number }
          - name: list
            label: Review List
            type: list
            fields:
              - { name: name, label: Name, type: string }
              - { name: timeAgo, label: Time Ago, type: string }
              - { name: text, label: Review Text, type: string }
      - name: collections
        label: Collections & Pricing
        type: object
        fields:
          - { name: kicker, label: Kicker, type: string }
          - { name: title, label: Title, type: string }
          - name: packages
            label: Packages
            type: list
            fields:
              - { name: name, label: Package Name, type: string }
              - { name: price, label: Price, type: string }
              - { name: featured, label: Featured, type: boolean }
              - { name: coverImage, label: Cover Image, type: image }
      - name: faq
        label: FAQ
        type: object
        fields:
          - { name: kicker, label: Kicker, type: string }
          - { name: title, label: Title, type: string }
          - name: questions
            label: Questions
            type: list
            fields:
              - { name: q, label: Question, type: string }
              - { name: a, label: Answer, type: string }
      - name: contact
        label: Contact
        type: object
        fields:
          - { name: kicker, label: Kicker, type: string }
          - { name: title, label: Title, type: string }
          - { name: lead, label: Lead Text, type: string }
